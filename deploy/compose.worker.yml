# 广西固废情报站 · news-worker（worker-only 部署，docs/CONSENSUS.md）
#
# 与平台（guangxi-solid-waste-map，compose 项目名 gswm）同机共栈：不建自己的 PostgreSQL，
# DATABASE_URL 指向平台 compose 的 db 服务（经外部网络 gswm_default，主机名 db）。
# 先在平台库实例里建独立库与账号（在部署机上执行一次）：
#   docker exec -it gswm-db-1 psql -U waste -d waste -c "CREATE ROLE aihot LOGIN PASSWORD '<随机>';" \
#     -c "CREATE DATABASE aihot OWNER aihot;"
#
# 只跑一个常驻容器 news-worker；apps/api 与 apps/web 代码保留但不部署。
#
# 用法（在仓库根目录）：
#   cp .env.example .env && $EDITOR .env        # 填密钥与平台地址
#   docker compose --env-file .env -f deploy/compose.worker.yml up -d --build
#   docker compose --env-file .env -f deploy/compose.worker.yml logs -f news-worker

name: gxsw-news

x-app: &app
  build:
    context: ..
    dockerfile: Dockerfile
  # gswm/ 命名空间与平台镜像家族对齐（gswm/backend、gswm/vision-engine、gswm/vision-infer）
  image: gswm/news-worker
  restart: unless-stopped

x-backend: &backend
  <<: *app
  env_file: ../.env
  environment:
    NODE_ENV: production
    # 平台 PostgreSQL 里的独立库（账号/库名与上面 CREATE ROLE/DATABASE 一致）
    DATABASE_URL: ${AIHOT_DATABASE_URL:-postgres://aihot:aihot@db:5432/aihot}
    AIHOT_DATA_DIR: /data
  volumes:
    - data:/data
  depends_on:
    db-gate:
      condition: service_completed_successfully

services:
  # 一次性门禁：平台 db 可连才继续（库和账号先建好；schema 由 setup 迁移创建）。
  db-gate:
    image: postgres:17-alpine
    restart: "no"
    command: ["sh", "-c", "until pg_isready -h ${AIHOT_DB_HOST:-db} -U aihot -t 5; do echo 'waiting for platform postgres…'; sleep 3; done"]

  # 一次性：跑迁移（引擎 + news-patrol 模块）并导入 industry/sources.json，然后退出。
  setup:
    <<: *backend
    restart: "no"
    command: ["sh", "-c", "node scripts/migrate.ts && node scripts/seed.ts"]
    depends_on:
      db-gate:
        condition: service_completed_successfully

  # 常驻 worker：采集、判重、评分、写作、聚簇 + news-patrol 巡检与平台推送。
  news-worker:
    <<: *backend
    command: ["node", "apps/worker/src/main.ts"]
    # 运维薄 HTTP（契约 v2）：仅容器内网可达（平台 api 经 gswm_default 打 8100），不映射宿主
    expose:
      - "8100"
    # 排空付费调用与备份再退出（沿用上游 worker 的宽限窗口）
    stop_grace_period: 515s
    depends_on:
      setup:
        condition: service_completed_successfully

volumes:
  data: {}

networks:
  default:
    name: ${PLATFORM_DOCKER_NETWORK:-gswm_default}
    external: true
